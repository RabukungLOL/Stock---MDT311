<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ข้อมูลสินค้า | ระบบสต็อกสินค้า</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="page-head">
      <h1 id="form-title">เพิ่มสินค้าใหม่</h1>
    </div>

    <div id="alert-box"></div>

    <form id="product-form" class="card" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="sku">รหัสสินค้า (SKU) <span class="required">*</span></label>
          <input type="text" id="sku" maxlength="30" placeholder="DRK-005">
          <div class="error" data-error-for="sku"></div>
        </div>
        <div class="field">
          <label for="name">ชื่อสินค้า <span class="required">*</span></label>
          <input type="text" id="name" maxlength="120" placeholder="น้ำส้ม 350 มล.">
          <div class="error" data-error-for="name"></div>
        </div>
        <div class="field">
          <label for="category_id">หมวดหมู่ <span class="required">*</span></label>
          <select id="category_id">
            <option value="">เลือกหมวดหมู่</option>
          </select>
          <div class="error" data-error-for="category_id"></div>
        </div>
        <div class="field">
          <label for="unit">หน่วยนับ</label>
          <input type="text" id="unit" maxlength="20" value="ชิ้น">
          <div class="error" data-error-for="unit"></div>
        </div>
        <div class="field">
          <label for="price">ราคาขาย (บาท)</label>
          <input type="number" id="price" min="0" step="0.01" value="0">
          <div class="error" data-error-for="price"></div>
        </div>
        <div class="field">
          <label for="reorder_level">จุดสั่งซื้อ</label>
          <input type="number" id="reorder_level" min="0" step="1" value="10">
          <div class="hint">ถ้าคงเหลือเท่ากับหรือต่ำกว่าค่านี้ ระบบจะแจ้งว่าใกล้หมด</div>
          <div class="error" data-error-for="reorder_level"></div>
        </div>

        <!-- แสดงเฉพาะตอนเพิ่มสินค้าใหม่ -->
        <div class="field" id="initial-stock-field">
          <label for="initial_stock">จำนวนเริ่มต้น</label>
          <input type="number" id="initial_stock" min="0" step="1" value="0">
          <div class="hint">ระบบจะบันทึกเป็นรายการรับเข้า "ยอดยกมา" ให้อัตโนมัติ</div>
          <div class="error" data-error-for="initial_stock"></div>
        </div>

        <!-- แสดงเฉพาะตอนแก้ไขสินค้า -->
        <div class="field" id="current-stock-field" hidden>
          <label>ยอดคงเหลือปัจจุบัน</label>
          <input type="text" id="current_stock" disabled>
          <div class="hint">แก้ยอดตรง ๆ ไม่ได้ ให้ทำผ่านหน้ารับเข้า / เบิกออก</div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="save-btn">บันทึก</button>
        <a href="products.html" class="btn">ยกเลิก</a>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/product-form.js"></script>
</body>
</html>
